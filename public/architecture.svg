<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1620" viewBox="0 0 1640 1620"><title>Lesson 05 message-type sequence</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#087fff"/></marker></defs><rect width="1640" height="1620" fill="white"/><text x="40" y="52" font-family="Arial" font-size="32" font-weight="bold" fill="#101a44">One stream · five core message shapes</text><rect x="15" y="90" width="290" height="80" rx="16" fill="#087fff"/><text x="160" y="139" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Student</text><path d="M160 170 V1570" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="345" y="90" width="290" height="80" rx="16" fill="#8838ff"/><text x="490" y="139" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">TypeScript host</text><path d="M490 170 V1570" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="675" y="90" width="290" height="80" rx="16" fill="#8838ff"/><text x="820" y="139" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Agent SDK</text><path d="M820 170 V1570" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="1005" y="90" width="290" height="80" rx="16" fill="#00a977"/><text x="1150" y="139" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Claude API</text><path d="M1150 170 V1570" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="1335" y="90" width="290" height="80" rx="16" fill="#087fff"/><text x="1480" y="139" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Read tool</text><path d="M1480 170 V1570" stroke="#aec6df" stroke-dasharray="8 7"/><text x="170" y="232" fill="#142d53" font-family="Arial" font-size="25">1. Submit task and streaming option</text><path d="M160 250 H490" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="500" y="332" fill="#142d53" font-family="Arial" font-size="25">2. query({ prompt, options })</text><path d="M490 350 H820" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="500" y="432" fill="#142d53" font-family="Arial" font-size="25">3. Yield system / init</text><path d="M820 450 H490" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="830" y="532" fill="#142d53" font-family="Arial" font-size="25">4. Send prompt and Read definition</text><path d="M820 550 H1150" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="830" y="632" fill="#142d53" font-family="Arial" font-size="25">5. Generate text or tool_use</text><path d="M1150 650 H820" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="500" y="732" fill="#142d53" font-family="Arial" font-size="25">6. Yield assistant content blocks</text><path d="M820 750 H490" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="830" y="832" fill="#142d53" font-family="Arial" font-size="25">7. Execute permitted Read</text><path d="M820 850 H1480" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="830" y="932" fill="#142d53" font-family="Arial" font-size="25">8. Return classroom file contents</text><path d="M1480 950 H820" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="500" y="1032" fill="#142d53" font-family="Arial" font-size="25">9. Yield user / tool_result</text><path d="M820 1050 H490" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="500" y="1132" fill="#142d53" font-family="Arial" font-size="25">10. Yield optional stream_event deltas</text><path d="M820 1150 H490" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="500" y="1232" fill="#142d53" font-family="Arial" font-size="25">11. Yield complete assistant text</text><path d="M820 1250 H490" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="500" y="1332" fill="#142d53" font-family="Arial" font-size="25">12. Yield typed result; drain trailing events</text><path d="M820 1350 H490" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="170" y="1432" fill="#142d53" font-family="Arial" font-size="25">13. Show log, JSON, pairs and outcome</text><path d="M490 1450 H160" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/></svg>